<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>

<h2>HTML Forms</h2>

<form action="/handleform" method="POST">
  <label for="username">Username:</label><br>
  <input type="text" id="username" name="username"><br>
  <label for="email">Email:</label><br>
  <input type="text" id="email" name="email">
  <p>Would you like to subscribe to our Newsletter:</p>
  <input type="radio" id="subscribe" value="subscribe">
  <label for="subscribe">YES</label><br>
  <input type="radio" id="unsubscribe" value="unsubscribe">
  <label for="unsubscribe">NO</label><br>
  <input type="submit" value="Submit">
</form>

</body>
</html>
